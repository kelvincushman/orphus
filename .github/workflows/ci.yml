name: Orphus

# The Orphus-specific gate: rooms, the digest bound, and the role launcher.
#
# The inherited Atomic workflows (test.yml, publish.yml, warm-toolchain-cache.yml)
# target Blacksmith runners that only exist on the upstream org, and
# test/ci/test-workflow-topology.test.ts pins their runner names — so they are
# left byte-identical to upstream and disabled at the repository level rather
# than rewritten here.
#
# Their suites used to be described as "running locally via the prek hooks in
# prek.toml". That was honour-system: scripts/install-hooks.mjs exits early
# whenever CI, GITHUB_ACTIONS, or PREK_DISABLE_INSTALL is set, and `npm ci` does
# not run the `prepare` script that installs them at all — so a contributor who
# clones and runs `npm ci` has no hooks and runs none of the 5.8k unit tests.
# The `suites` job below is what actually enforces them, on a standard runner.

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, for when GitHub drops a push trigger (as it did for d9ad9814).
  workflow_dispatch:

permissions:
  contents: read

# A push to a PR branch supersedes the run already in flight for it. Every
# inherited workflow sets one of these; this one did not, so a stack of quick
# pushes queued a full duplicate run each time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: everything that needs no native bindings. Fails in ~2 minutes on
  # a lint slip or a broken digest bound, without waiting for the full suite.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Bun runs the demo and the role launcher; see AGENTS.md for the split.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # biome (--error-on-warnings), tsc --noEmit, and the shrinkwrap check.
      # Previously none of these ran here: lint and format were enforced only by
      # the prek hooks described above, so a lint error could reach main.
      - name: Lint, typecheck, and shrinkwrap
        run: npm run check

      # The root tsconfig excludes packages/coding-agent, so `npm run check`
      # above never sees the binary's own source — and the Orphus rebrand
      # touched that package heavily. Upstream covered it with this build inside
      # test.yml's `suites` job, which this fork disabled without replacing.
      - name: Typecheck the orphus binary's source
        working-directory: packages/coding-agent
        run: npm run build

      # Scoped to the Orphus additions: these need no native bindings, so this
      # job stays fast. The full inherited suite runs in `suites` below.
      - name: Rooms and role-launcher tests
        run: npx vitest --run --project unit test/unit/roundtable-

      # Asserts the late-joiner ratio against the 40% phase-1 exit criterion and
      # exits non-zero above it. Before, this ran as a smoke test that passed on
      # exit code alone, so the project's headline number could regress freely.
      - name: Demo — bounded digest for a late joiner
        run: bun packages/roundtable/demo/run-demo.ts
        env:
          ORPHUS_CODING_AGENT_DIR: ${{ runner.temp }}/orphus-agent

      # The example manifest ships as a template; keep it parseable and planable.
      - name: Role manifest plans
        run: bun packages/roundtable/bin/orphus-roles.ts --format json

  # The inherited suites, on a standard runner rather than the Blacksmith ones
  # the upstream workflow pins. Runs in parallel with `verify`.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deliberately no `lfs: true`. The upstream job fetches LFS because it runs
      # the coding-agent suite, which reads LFS fixtures; this job does not. And
      # this fork cannot fetch them anyway — four LFS objects 404 against its own
      # server, so requesting them fails checkout before a single test runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # packages/subagents drives its children through crates/atomic-natives, so
      # without a binding the bundled subagent extension fails at import — which
      # takes the whole unit suite down, not just the runner tests.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        timeout-minutes: 4
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native bindings
        run: npm run build --workspace=@bastani/atomic-natives

      # test/unit/pi-0.82.1-artifacts.test.ts degrades to test.skip when
      # packages/coding-agent/dist is absent, so skipping this build would lose
      # coverage silently rather than fail.
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # These pin the workflows in .github/workflows, including this file.
      - name: CI contract tests
        run: npm run test:ci-contracts

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: .ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

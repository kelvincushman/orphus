name: Orphus

# The Orphus-specific gate: rooms, the digest bound, and the role launcher.
#
# The inherited Atomic workflows (test.yml, publish.yml, warm-toolchain-cache.yml)
# target Blacksmith runners that only exist on the upstream org, and
# test/ci/test-workflow-topology.test.ts pins their runner names — so they are
# disabled at the repository level rather than rewritten here. publish.yml and
# warm-toolchain-cache.yml are left byte-identical to upstream; test.yml cannot
# be, because it carries the rebrand's ORPHUS_REQUIRE_* env-var names.
#
# Their suites used to be described as "running locally via the prek hooks in
# prek.toml". That was honour-system: scripts/install-hooks.mjs exits early
# whenever CI, GITHUB_ACTIONS, or PREK_DISABLE_INSTALL is set, and `npm ci` does
# not run the `prepare` script that installs them at all — so a contributor who
# clones and runs `npm ci` has no hooks and runs none of the 5.8k unit tests.
# The `suites` job below is what actually enforces them, on a standard runner.

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, for when GitHub drops a push trigger (as it did for d9ad9814).
  workflow_dispatch:

permissions:
  contents: read

# A push to a PR branch supersedes the run already in flight for it. Every
# inherited workflow sets one of these; this one did not, so a stack of quick
# pushes queued a full duplicate run each time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: everything that needs no native bindings. Fails in ~2 minutes on
  # a lint slip or a broken digest bound, without waiting for the full suite.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Bun runs the demo and the role launcher; see AGENTS.md for the split.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # biome (--error-on-warnings), tsc --noEmit, and the shrinkwrap check.
      # Previously none of these ran here: lint and format were enforced only by
      # the prek hooks described above, so a lint error could reach main.
      - name: Lint, typecheck, and shrinkwrap
        run: npm run check

      # The root tsconfig excludes packages/coding-agent, so `npm run check`
      # above never sees the binary's own source — and the Orphus rebrand
      # touched that package heavily. Upstream covered it with this build inside
      # test.yml's `suites` job, which this fork disabled without replacing.
      - name: Typecheck the orphus binary's source
        working-directory: packages/coding-agent
        run: npm run build

      # Scoped to the Orphus additions: these need no native bindings, so this
      # job stays fast. The full inherited suite runs in `suites` below.
      - name: Rooms and role-launcher tests
        run: npx vitest --run --project unit test/unit/roundtable-

      # Asserts the late-joiner ratio against the 40% phase-1 exit criterion and
      # exits non-zero above it. Before, this ran as a smoke test that passed on
      # exit code alone, so the project's headline number could regress freely.
      - name: Demo — bounded digest for a late joiner
        run: bun packages/roundtable/demo/run-demo.ts
        env:
          ORPHUS_CODING_AGENT_DIR: ${{ runner.temp }}/orphus-agent

      # Asserts the properties it prints, so a broken loop fails the build.
      # Hermetic: builds its own broker and wiki under a temp dir.
      - name: Demo — the full loop (room → export → memory → later recall)
        run: npm run demo:loop

      # The example manifest ships as a template; keep it parseable and planable.
      - name: Role manifest plans
        run: bun packages/roundtable/bin/orphus-roles.ts --format json

  # The inherited suites, on a standard runner rather than the Blacksmith ones
  # the upstream workflow pins. Runs in parallel with `verify`.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deliberately no LFS object download. The upstream job fetches LFS because
      # it runs the coding-agent suite, which reads LFS fixtures; this job does
      # not. This fork cannot fetch them anyway — four LFS objects 404 against
      # its own server, so requesting them fails checkout before any test runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fork has no local tags, while the inherited changelog suite compares
      # released sections with Atomic's immutable release tags.
      - name: Fetch inherited release tags
        run: git fetch --no-tags https://github.com/bastani-inc/atomic.git 'refs/tags/*:refs/tags/*'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # packages/subagents drives its children through crates/atomic-natives, so
      # without a binding the bundled subagent extension fails at import — which
      # takes the whole unit suite down, not just the runner tests.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        timeout-minutes: 4
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native bindings
        run: npm run build --workspace=@bastani/atomic-natives

      # test/unit/pi-0.82.1-artifacts.test.ts degrades to test.skip when
      # packages/coding-agent/dist is absent, so skipping this build would lose
      # coverage silently rather than fail.
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build

      # One file in this suite was already red on main when this job was added.
      # It is quarantined by name in vitest.config.ts, with the reason beside it,
      # so the exclusion is visible rather than buried in a workflow argument.
      # The changelog suite still runs after the inherited tags are fetched.
      - name: Unit tests
        run: npm run test:unit

      # These pin the workflows in .github/workflows, including this file.
      - name: CI contract tests
        run: npm run test:ci-contracts

      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: .ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  # The review gate. CodeRabbit reports its check as PASSING even when it
  # declined to review — the summary comment then says "Review skipped", and
  # the reason has twice been something nobody would notice: path filters that
  # had silently become an allowlist (#69), and a file-count ceiling on a large
  # rename (#82). A gate that goes green without reviewing is worse than no
  # gate, because the process believes it ran.
  #
  # This job fails when the robot skipped, so a hollow gate is red. Two escapes,
  # both deliberate and visible: the `review-exempt` label (for changes no robot
  # can usefully review), or a `Substitute-review:` line in the PR body pointing
  # at whatever stood in — an independent reviewer, a human pass, a fleet gate.
  review-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a review that actually ran
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'review-exempt'; then
            echo "::notice::review-exempt label present — review gate waived deliberately."
            exit 0
          fi

          body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          if printf '%s' "$body" | grep -qiE '^Substitute-review:[[:space:]]*\S'; then
            printf '%s\n' "$body" | grep -iE '^Substitute-review:' | while read -r line; do
              echo "::notice::Substitute review declared — $line"
            done
            exit 0
          fi

          # The newest CodeRabbit comment decides: it re-posts on each review.
          comment=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login | startswith("coderabbit")) | .body] | last // ""')

          if [ -z "$comment" ]; then
            echo "::error::No CodeRabbit comment found. The review has not run (or not yet) — this gate needs a completed review, the review-exempt label, or a Substitute-review: line in the PR body."
            exit 1
          fi

          if printf '%s' "$comment" | grep -qiE 'review (was )?skipped'; then
            echo "::error::CodeRabbit reported its check as passing but SKIPPED the review. Reason from its comment:"
            printf '%s' "$comment" | grep -iE 'skipped|exceed|filter' | head -5 || true
            echo "::error::Fix the cause, split the PR, or declare a substitute: add a 'Substitute-review: <what reviewed this>' line to the PR body, or the review-exempt label."
            exit 1
          fi

          echo "CodeRabbit review completed."

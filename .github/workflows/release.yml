name: Release

# Builds downloadable binaries and attaches them to a GitHub Release.
#
# The README describes compiling release binaries, and until now nothing
# automated it: publish.yml is disabled at the repository level, targets
# Blacksmith runners registered to the upstream organization, and would publish
# to npm under the upstream package name. This workflow does the one part this
# fork actually needs — produce something a user can download — and deliberately
# does not publish to any registry.
#
# Linux x64, macOS arm64, and Windows x64 only, on purpose. Every platform needs its own
# napi-slug `.node` staged before scripts/build-binaries.sh will run (it exits 1
# rather than warning), so each additional target is another job. Targets are
# added as they are actually wanted.
#
# The Linux `.node` is built through cargo-zigbuild rather than plainly on the
# host, because a host build links the runner's glibc and that alone set the
# archive's floor. See GLIBC_FLOOR below. The darwin build has no glibc — the
# host build IS the target, so it needs neither zig nor a cross target.
#
# One thing this does NOT match about upstream's publish.yml, stated so nobody
# assumes otherwise:
#
#   * scripts/build-binaries.sh emits an `atomic` archive. The packaging steps
#     below rename both the archive root and executable to `orphus` before the
#     release is staged; the shared upstream build script remains unchanged.

on:
  push:
    # `v`-prefixed so it never collides with inherited bare numeric release tags.
    tags: ["v*"]

permissions:
  contents: read

env:
  # Matches publish.yml. The archive cannot actually reach 2.17: the prebuilt
  # @embedded-postgres server binaries it bundles require 2.27, and this workflow
  # does not build them. Pinning what we do build takes the floor to that 2.27.
  GLIBC_FLOOR: "2.17"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # .gitmodules declares two eval submodules that are not needed to build
          # and are not initialized in this repository.
          submodules: false
      # The fork inherited this pointer without its LFS object. Fetch the exact
      # release asset from the public upstream and prove its content hash before
      # the build can copy it into an archive.
      - name: Hydrate the interactive release asset
        env:
          ASSET: packages/coding-agent/src/modes/interactive/assets/clankolas.png
          ASSET_SHA256: 169acd0dfe6fbb8d8742ed24a3fc654fd0b2e2d4223c733249c5493723f1b72d
        run: |
          set -euo pipefail
          git lfs install --local
          git remote add upstream-lfs https://github.com/bastani-inc/atomic.git
          git lfs fetch upstream-lfs HEAD --include="$ASSET" --exclude=''
          git lfs checkout "$ASSET"
          test "$(sha256sum "$ASSET" | cut -d' ' -f1)" = "$ASSET_SHA256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable
          # cargo-zigbuild pins the glibc floor, but rustup still needs the bare
          # triple installed; the floor is expressed in CROSS_TARGET below.
          targets: x86_64-unknown-linux-gnu

      # Community Zig mirrors have stalled on upstream's runners, and setup-zig
      # applies no per-mirror deadline, so bound it and retry once on a
      # re-shuffled list — the same pattern publish.yml uses.
      - name: Setup zig for the glibc floor
        id: zig
        continue-on-error: true
        timeout-minutes: 2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Retry zig acquisition on a re-shuffled mirror list
        if: steps.zig.outcome == 'failure'
        timeout-minutes: 2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      # Pinned: an unversioned taiki-e tool resolves to @latest, which floats the
      # build toolchain of a published artifact with no diff to show for it.
      - name: Install cargo-zigbuild
        timeout-minutes: 3
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate and stamp the release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.[1-9][0-9]*)?$ ]]
          [[ "$VERSION" != "0.0.0" ]]
          bun run scripts/bump-version.ts "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # build-binaries.sh hard-fails per platform when the matching .node is
      # absent. CROSS_TARGET carries the `<triple>.<major>.<minor>` form that
      # build-native.ts routes to cargo-zigbuild's glibc pinning; without it this
      # is a host build that links the runner's glibc and sets the whole
      # archive's floor. Measured on the v0.1.0-alpha.2 artifact, this .node was
      # the only component above 2.27 — it required 2.39 while the Bun-compiled
      # binary needed only 2.17.
      - name: Build native bindings
        env:
          CROSS_TARGET: x86_64-unknown-linux-gnu.${{ env.GLIBC_FLOOR }}
        run: bun run --cwd packages/natives build

      - name: Build the Linux x64 archive
        run: ./scripts/build-binaries.sh --skip-deps --skip-install --platform linux-x64

      - name: Package and verify the Orphus archive
        working-directory: packages/coding-agent/binaries
        run: |
          set -euo pipefail
          mkdir release
          tar -xzf atomic-linux-x64.tar.gz -C release
          mv release/atomic release/orphus
          mv release/orphus/atomic release/orphus/orphus
          test "$(release/orphus/orphus --version)" = "$VERSION"
          highest_glibc="$(
            find release/orphus -type f \
              \( -perm -111 -o -name '*.node' -o -name '*.so' -o -name '*.so.*' \) \
              -exec strings -a {} + \
              | grep -o "GLIBC_2\.[0-9]*" | sort -u -t. -k2,2n | tail -1
          )"
          test "$highest_glibc" = "GLIBC_2.27"
          echo "Archive glibc floor verified: $highest_glibc"
          tar -czf orphus-linux-x64.tar.gz -C release orphus
          rm -rf release atomic-linux-x64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orphus-linux-x64
          path: packages/coding-agent/binaries/orphus-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-darwin:
    # GitHub-hosted macos-15 runners are Apple Silicon; the host build IS the
    # darwin-arm64 target, so no zig, no cargo-zigbuild, no cross target.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      # Same LFS hydration as build-linux; macOS ships shasum, not sha256sum.
      - name: Hydrate the interactive release asset
        env:
          ASSET: packages/coding-agent/src/modes/interactive/assets/clankolas.png
          ASSET_SHA256: 169acd0dfe6fbb8d8742ed24a3fc654fd0b2e2d4223c733249c5493723f1b72d
        run: |
          set -euo pipefail
          git lfs install --local
          git remote add upstream-lfs https://github.com/bastani-inc/atomic.git
          git lfs fetch upstream-lfs HEAD --include="$ASSET" --exclude=''
          git lfs checkout "$ASSET"
          test "$(shasum -a 256 "$ASSET" | cut -d' ' -f1)" = "$ASSET_SHA256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      # publish.yml carries this quirk: macOS runners preinstall a rustup whose
      # default toolchain can shadow the pinned one, so prepend the pinned bin.
      - name: Prefer pinned rustup toolchain on macOS
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate and stamp the release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.[1-9][0-9]*)?$ ]]
          [[ "$VERSION" != "0.0.0" ]]
          bun run scripts/bump-version.ts "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # NATIVE_TARGET (not CROSS_TARGET) is publish.yml's darwin path: an
      # explicit host-triple napi build with no glibc involvement.
      - name: Build native bindings
        env:
          NATIVE_TARGET: aarch64-apple-darwin
        run: bun run --cwd packages/natives build

      - name: Build the macOS arm64 archive
        run: ./scripts/build-binaries.sh --skip-deps --skip-install --platform darwin-arm64

      - name: Package and verify the Orphus archive
        working-directory: packages/coding-agent/binaries
        run: |
          set -euo pipefail
          mkdir release
          tar -xzf atomic-darwin-arm64.tar.gz -C release
          mv release/atomic release/orphus
          mv release/orphus/atomic release/orphus/orphus
          test "$(release/orphus/orphus --version)" = "$VERSION"
          file release/orphus/orphus | grep -q arm64
          tar -czf orphus-darwin-arm64.tar.gz -C release orphus
          rm -rf release atomic-darwin-arm64.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orphus-darwin-arm64
          path: packages/coding-agent/binaries/orphus-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      # Same LFS hydration as the Unix jobs, expressed through Git Bash so the
      # content-addressed asset contract stays identical.
      - name: Hydrate the interactive release asset
        shell: bash
        env:
          ASSET: packages/coding-agent/src/modes/interactive/assets/clankolas.png
          ASSET_SHA256: 169acd0dfe6fbb8d8742ed24a3fc654fd0b2e2d4223c733249c5493723f1b72d
        run: |
          set -euo pipefail
          git lfs install --local
          git remote add upstream-lfs https://github.com/bastani-inc/atomic.git
          git lfs fetch upstream-lfs HEAD --include="$ASSET" --exclude=''
          git lfs checkout "$ASSET"
          test "$(sha256sum "$ASSET" | cut -d' ' -f1)" = "$ASSET_SHA256"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate and stamp the release version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.[1-9][0-9]*)?$ ]]
          [[ "$VERSION" != "0.0.0" ]]
          bun run scripts/bump-version.ts "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the Windows x64 archive
        shell: bash
        run: ./scripts/build-binaries.sh --skip-deps --skip-install --platform windows-x64

      - name: Package and verify the Orphus archive
        shell: pwsh
        working-directory: packages/coding-agent/binaries
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path release | Out-Null
          Expand-Archive -Path atomic-windows-x64.zip -DestinationPath release/orphus
          Rename-Item -Path release/orphus/atomic.exe -NewName orphus.exe
          $version = & ./release/orphus/orphus.exe --version
          if ($version -ne $env:VERSION) {
            throw "Expected version $env:VERSION, got $version"
          }
          bun run ../../../scripts/assert-builtin-set.ts ./release/orphus/builtin
          if ($LASTEXITCODE -ne 0) { throw "Bundled extension set is incomplete" }
          foreach ($path in @(
            "release/orphus/app.js",
            "release/orphus/builtin/workflows/package.json",
            "release/orphus/builtin/subagents/package.json",
            "release/orphus/node_modules/@orphus/natives/native/atomic_natives.win32-x64-msvc.node",
            "release/orphus/native/win32/prebuilds/win32-x64/win32-console-mode.node"
          )) {
            if (-not (Test-Path $path)) { throw "Missing release archive path: $path" }
          }
          $orphus = (Resolve-Path ./release/orphus/orphus.exe).Path
          $smoke = Join-Path $env:RUNNER_TEMP "orphus-windows-cwd"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Push-Location $smoke
          $output = "" | & $orphus --no-session 2>&1 | Out-String
          $status = $LASTEXITCODE
          Pop-Location
          Write-Host $output
          if ($output -match "Failed to load extension") { throw "Bundled extension failed to load" }
          if ($status -ne 0 -and $output -notmatch "No models available|No model selected|No API key found") {
            throw "Unexpected clean-start exit: $status"
          }
          Compress-Archive -Path release/orphus -DestinationPath orphus-windows-x64.zip -Force
          Remove-Item -Recurse -Force release, atomic-windows-x64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orphus-windows-x64
          path: packages/coding-agent/binaries/orphus-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only to create the draft release; nothing here needs id-token.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binaries
          merge-multiple: true

      - name: Checksum
        working-directory: binaries
        run: sha256sum orphus-darwin-arm64.tar.gz orphus-linux-x64.tar.gz orphus-windows-x64.zip > SHA256SUMS

      # Draft, so a human decides whether the artifact is worth publishing —
      # matching publish.yml's staging behaviour, which never undrafts until the
      # rest of a release has succeeded.
      - name: Stage a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd binaries
          # The tag tree carries the release announcement (RELEASE_NOTES.md at
          # the repo root); the platform line is the fallback so a tag without
          # notes still stages a usable draft.
          existing=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" != false ]] || { echo "Release $TAG is already public; refusing to mutate it." >&2; exit 1; }
          [[ "$existing" != true ]] || gh release delete "$TAG" --yes
          if [ -f ../RELEASE_NOTES.md ]; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file ../RELEASE_NOTES.md
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes \
              'Linux x64, macOS arm64, and Windows x64 builds. Linux requires glibc 2.27 or newer; the archive verifies this exact floor before staging.'
          fi
          assets=(orphus-darwin-arm64.tar.gz orphus-linux-x64.tar.gz orphus-windows-x64.zip SHA256SUMS)
          for asset in "${assets[@]}"; do
            gh release upload "$TAG" "$asset"
          done
          expected=$(printf '%s\n' "${assets[@]}" | sort)
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          [[ "$actual" == "$expected" ]] || { echo "Draft release asset set mismatch" >&2; exit 1; }

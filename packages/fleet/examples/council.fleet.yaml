# Council: four stances argue a consequential decision to a labelled verdict.
# No code is written — the output is a decision of record synthesized by the
# orchestrator from the room digest, with the strongest dissent kept verbatim.
#
# AS SHIPPED, THIS IS A SAME-PROVIDER COUNCIL. All four seats use the `worker`
# agent, so all four inherit one primary model and one fallback ladder: the
# stances differ, the training behind them does not. A verdict from this
# blueprint unmodified must be labelled `same-provider` — or `unverified` if
# you have not checked which model `worker` actually resolved to. Claiming
# provider diversity here would be claiming something you did not buy.
#
# To make it a genuine cross-provider council, pin each seat to a different
# provider from among those you have configured:
#   - agent: worker
#     model: openai/gpt-5.6-luna       # architect
#   - agent: worker
#     model: anthropic/claude-opus     # skeptic
#   - agent: worker
#     model: google/gemini-3-pro       # pragmatist
#   - agent: worker
#     model: xai/grok-4.5              # critic
# Then `fleet({ action: "validate", name: "council" })` checks every pin
# resolves and has credentials, and the verdict may say `cross-provider`.
name: council
description: Four-stance deliberation to a decision of record, strongest dissent preserved, provider relationship labelled.
version: 1

teams:
  council:
    mode: deliberate
    room: council
    topic: The decision under review, and what evidence would settle it
    rounds: 2
    members:
      - agent: worker
        tools: [read, search, find, ls, roundtable]
        brief: |
          Architect. Propose the structure that best fits the codebase as it
          is today; cite files, not preferences.
      - agent: worker
        tools: [read, search, find, ls, roundtable]
        brief: |
          Skeptic. Find the failure mode in every proposal and name the
          evidence that would change your mind.
      - agent: worker
        tools: [read, search, find, ls, roundtable]
        brief: |
          Pragmatist. Argue for the smallest change that ships and say what it
          defers; put a rough cost on each alternative.
      - agent: worker
        tools: [read, search, find, ls, roundtable]
        brief: |
          Critic. Attack the emerging consensus and state the strongest
          opposing view plainly, so it survives into the verdict verbatim.
